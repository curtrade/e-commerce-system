name: CD

on:
  push:
    branches: [master]
    paths:
      - "apps/**"
      - "libs/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "tracing.js"
      - "docker-stack.yml"
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Build and deploy all services"
        type: boolean
        default: true

concurrency:
  group: cd-master
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ecommerce

jobs:
  # ---------------------------------------------------------------------------
  # 1. Detect which services changed (or all on manual trigger)
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.result.outputs.services }}
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3.0.2
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            orders:
              - 'apps/orders/**'
              - 'libs/common/**'
              - 'Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - 'tracing.js'
            payments:
              - 'apps/payments/**'
              - 'libs/common/**'
              - 'Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - 'tracing.js'
            inventory:
              - 'apps/inventory/**'
              - 'libs/common/**'
              - 'Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - 'tracing.js'
            notifications:
              - 'apps/notifications/**'
              - 'libs/common/**'
              - 'Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - 'tracing.js'

      - id: result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.deploy_all }}" = "true" ]; then
            echo 'services=["orders","payments","inventory","notifications"]' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'services=[]' >> "$GITHUB_OUTPUT"
          else
            echo 'services=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 2. Build & push Docker images (runtime + migrate) per changed service
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: SERVICE=${{ matrix.service }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ needs.changes.outputs.sha_short }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          build-args: SERVICE=${{ matrix.service }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}-migrate:sha-${{ needs.changes.outputs.sha_short }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}-migrate:latest
          cache-from: type=gha,scope=${{ matrix.service }}-migrate
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-migrate

  # ---------------------------------------------------------------------------
  # 3. Deploy → Staging
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy → Staging
    needs: [changes, build]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Copy stack file and scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          source: "docker-stack.yml,scripts/deploy.sh,scripts/create-swarm-secrets.sh"
          target: /opt/ecommerce/

      - name: Run migrations & deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: sha-${{ needs.changes.outputs.sha_short }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_PREFIX,GHCR_TOKEN,GHCR_USER
          script: |
            chmod +x /opt/ecommerce/scripts/deploy.sh
            /opt/ecommerce/scripts/deploy.sh

  # ---------------------------------------------------------------------------
  # 4. Deploy → Production (manual approval via GitHub Environment)
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy → Production
    needs: [changes, build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy stack file and scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          source: "docker-stack.yml,scripts/deploy.sh,scripts/create-swarm-secrets.sh"
          target: /opt/ecommerce/

      - name: Run migrations & deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: sha-${{ needs.changes.outputs.sha_short }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SWARM_HOST }}
          username: ${{ secrets.SWARM_USER }}
          key: ${{ secrets.SWARM_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_PREFIX,GHCR_TOKEN,GHCR_USER
          script: |
            chmod +x /opt/ecommerce/scripts/deploy.sh
            /opt/ecommerce/scripts/deploy.sh
