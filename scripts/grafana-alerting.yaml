apiVersion: 1

contactPoints:
  - orgId: 1
    name: default
    receivers:
      - uid: default-log
        type: log
        settings: {}

policies:
  - orgId: 1
    receiver: default
    group_by: ["alertname", "service_name"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  # -- Prometheus-based alerts --------------------------------------------------
  - orgId: 1
    name: http
    folder: E-Commerce
    interval: 1m
    rules:
      - uid: http-error-rate
        title: "HTTP 5xx > 5%"
        for: 5m
        annotations:
          summary: "Сервис {{ $labels.service_name }} отдаёт >5% ошибок 5xx"
        labels:
          severity: critical
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              instant: true
              expr: |
                (
                  sum by (service_name) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
                  /
                  clamp_min(sum by (service_name) (rate(http_server_request_duration_seconds_count[5m])), 1e-10)
                )
          - refId: B
            datasourceUid: __expr__
            model: { type: reduce, expression: A, reducer: last, refId: B }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      - uid: http-latency-p95
        title: "P95 latency > 2s"
        for: 5m
        annotations:
          summary: "Сервис {{ $labels.service_name }}: p95 latency > 2s"
        labels:
          severity: warning
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              instant: true
              expr: |
                histogram_quantile(0.95,
                  sum by (service_name, le) (rate(http_server_request_duration_seconds_bucket[5m]))
                )
          - refId: B
            datasourceUid: __expr__
            model: { type: reduce, expression: A, reducer: last, refId: B }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: { type: gt, params: [2] }

  # -- Loki-based alerts -------------------------------------------------------
  - orgId: 1
    name: logs
    folder: E-Commerce
    interval: 1m
    rules:
      - uid: error-log-spike
        title: "ERROR log spike > 10 / 5min"
        for: 5m
        annotations:
          summary: "Сервис {{ $labels.service_name }}: >10 ERROR-записей за 5 мин"
        labels:
          severity: warning
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: |
                sum by (service_name) (count_over_time({service_name=~".+"} |= `"level":"ERROR"` [5m]))
          - refId: B
            datasourceUid: __expr__
            model: { type: reduce, expression: A, reducer: last, refId: B }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: { type: gt, params: [10] }

      - uid: outbox-dead-letter
        title: "Outbox dead-letter rows"
        for: 1m
        annotations:
          summary: "OutboxPublisher: строки достигли max attempts (dead-letter)"
        labels:
          severity: critical
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              expr: |
                sum(count_over_time({service_name="orders"} |= `OutboxPublisher` |= `max attempts` [5m]))
          - refId: B
            datasourceUid: __expr__
            model: { type: reduce, expression: A, reducer: last, refId: B }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
